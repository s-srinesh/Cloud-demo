services:
  # MongoDB Database Service (internal only, not exposed to outside)
  mongodb:
    image: mongo:6.0
    container_name: student-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Backend Express API Service (internal only, not exposed to outside)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/userDB
    depends_on:
      - mongodb
    networks:
      - app-network

  # Frontend React App Service via Nginx (ONLY service exposed on port 80)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: student-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
